    name: Releases
    type: ChangeLog
    description: 'null'
  description: >-
    The OneAtlas Data Pay-Per-Order API is a powerful tool that enables users to access and purchase high-resolution
    satellite imagery, elevation data, and other geospatial information on a pay-as-you-go basis. By integrating
    this API into their applications or systems, users can quickly and easily obtain the precise data
    they need for their projects without committing to long-term subscriptions or contracts.
  features:
  - Purchase and download archived satellite imagery on demand
  - Pay-as-you-go pricing with no subscription commitment
  - Access to historical imagery archive with global coverage
  - Multiple delivery formats and resolution options
