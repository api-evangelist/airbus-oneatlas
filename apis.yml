    type: JupyterNotebook
    description: 'null'
  - url: https://api.oneatlas.airbus.com/releases/#oad-pay-per-order-tasking
    name: Releases
    type: ChangeLog
    description: 'null'
  description: >-
    The OneAtlas Data Pay-Per-Order Tasking API allows users to directly request high-resolution satellite
    imagery of specific locations at their convenience. With this API, users can easily select areas of
    interest, order and pay for the data they need, and receive the requested imagery quickly and efficiently.
    This tool enables users to access up-to-date satellite data for a wide range of applications, such
    as environmental monitoring, agriculture, urban planning, and disaster response.
  features:
  - Commission new satellite imagery acquisitions of specific locations
  - Select acquisition parameters including resolution and urgency
  - Track tasking order status and estimated delivery
  - Access to Pleiades Neo and Pleiades satellite fleet
