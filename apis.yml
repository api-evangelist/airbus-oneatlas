created: '2025-02-06'
modified: '2026-05-19'
position: Consumer
description: >-
  Airbus OneAtlas is the commercial geospatial platform from Airbus Defence and Space, providing developer APIs for
  accessing high-resolution satellite imagery, elevation data, basemaps, and radar data. The platform covers optical
  imagery via the Living Library and Pay-Per-Order services, satellite tasking for new acquisitions, WorldDEM global
  elevation data, SAR radar imagery, and seamless basemap tiles.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
specificationVersion: '0.23'
