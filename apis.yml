    name: Releases
    type: ChangeLog
    description: 'null'
  description: >-
    OneAtlas Data Living Library is a platform that provides users with access to a diverse range of geospatial
    data and satellite imagery. The library is constantly updated with the latest data, ensuring that
    users have access to accurate and timely information for their projects. Users can easily search for
    and find the data they need, whether it be for environmental monitoring, urban planning, agriculture,
    or any other application.
  features:
  - Search and stream satellite imagery from a continuously updated library
  - Filter by date range, cloud cover, and area of interest
  - Access optical imagery from Pleiades, SPOT, and third-party satellites
  - Jupyter notebook and Postman collection support
