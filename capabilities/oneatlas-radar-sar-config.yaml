    description: Airbus OneAtlas OneAtlas Radar API — Sar/Config business capability. Self-contained, no shared references.
    resources:
    - name: sar-config
      path: /sar/config
      operations:
      - name: get
        method: GET
        description: Airbus OneAtlas Retrieve Entire Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
