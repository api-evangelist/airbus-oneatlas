naftiko: 1.0.0-alpha2
info:
  label: Airbus OneAtlas OneAtlas Radar API — Sar/Config
  description: 'Airbus OneAtlas OneAtlas Radar API — Sar/Config. 4 operations. Lead operation: Airbus OneAtlas Retrieve Entire
