    description: REST adapter for Airbus OneAtlas OneAtlas Radar API — Sar/Config. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/sar/config
      name: sar-config
      description: REST surface for sar-config.
      operations:
      - method: GET
        name: get
        description: Airbus OneAtlas Retrieve Entire Configuration
        call: oneatlas-radar-sar-config.get
        outputParameters:
        - type: object
          mapping: $.
