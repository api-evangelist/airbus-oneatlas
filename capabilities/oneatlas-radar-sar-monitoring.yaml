naftiko: 1.0.0-alpha2
info:
  label: Airbus OneAtlas OneAtlas Radar API — Sar/Monitoring
  description: 'Airbus OneAtlas OneAtlas Radar API — Sar/Monitoring. 4 operations. Lead operation: Airbus OneAtlas Get List
    of Orders. Self-contained Naftiko capability covering one Airbus Oneatlas business surface.'
  tags:
  - Airbus Oneatlas
  - Sar/Monitoring
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AIRBUS_ONEATLAS_API_KEY: AIRBUS_ONEATLAS_API_KEY
capability:
