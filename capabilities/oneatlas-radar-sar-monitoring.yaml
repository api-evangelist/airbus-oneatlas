    port: 9090
    transport: http
    description: MCP adapter for Airbus OneAtlas OneAtlas Radar API — Sar/Monitoring. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: airbus-oneatlas-get-list-orders
      description: Airbus OneAtlas Get List of Orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: oneatlas-radar-sar-monitoring.get
      outputParameters:
      - type: object
        mapping: $.
    - name: airbus-oneatlas-get-items-only
      description: Airbus OneAtlas Get Items Only with OrderItemId
