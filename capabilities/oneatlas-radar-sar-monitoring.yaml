      - name: get
        method: GET
        description: Airbus OneAtlas Get Order Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.AIRBUS_ONEATLAS_USER}}'
      password: '{{env.AIRBUS_ONEATLAS_PASS}}'
  exposes:
  - type: rest
    namespace: oneatlas-radar-sar-monitoring-rest
    port: 8080
    description: REST adapter for Airbus OneAtlas OneAtlas Radar API — Sar/Monitoring. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sar/orders
      name: sar-orders
      description: REST surface for sar-orders.
      operations:
      - method: GET
        name: get
        description: Airbus OneAtlas Get List of Orders
        call: oneatlas-radar-sar-monitoring.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sar/orders//items
      name: sar-orders-items
      description: REST surface for sar-orders-*-items.
      operations:
      - method: POST
        name: post
        description: Airbus OneAtlas Get Items Only with OrderItemId
        call: oneatlas-radar-sar-monitoring.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sar/orders//items/status
      name: sar-orders-items-status
      description: REST surface for sar-orders-*-items-status.
      operations:
      - method: POST
        name: post
        description: Airbus OneAtlas Get Status of Items with Filter
        call: oneatlas-radar-sar-monitoring.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sar/orders/{orderidorbasketid}
      name: sar-orders-orderidorbasketid
      description: REST surface for sar-orders-orderIdOrBasketId.
      operations:
      - method: GET
        name: get
        description: Airbus OneAtlas Get Order Details
        call: oneatlas-radar-sar-monitoring.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
