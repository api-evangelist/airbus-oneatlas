    baseUri: https://sar.api.oneatlas.airbus.com/v1
    description: Airbus OneAtlas OneAtlas Radar API — Sar/Monitoring business capability. Self-contained, no shared references.
    resources:
    - name: sar-orders
      path: /sar/orders
      operations:
      - name: get
        method: GET
        description: Airbus OneAtlas Get List of Orders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sar-orders-*-items
      path: /sar/orders/*/items
      operations:
      - name: post
        method: POST
        description: Airbus OneAtlas Get Items Only with OrderItemId
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: sar-orders-*-items-status
      path: /sar/orders/*/items/status
      operations:
      - name: post
        method: POST
        description: Airbus OneAtlas Get Status of Items with Filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
