        readOnly: true
        destructive: false
        idempotent: false
      call: oneatlas-radar-sar-monitoring.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: airbus-oneatlas-get-status-items
      description: Airbus OneAtlas Get Status of Items with Filter
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: oneatlas-radar-sar-monitoring.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: airbus-oneatlas-get-order-details
      description: Airbus OneAtlas Get Order Details
