naftiko: 1.0.0-alpha2
info:
  label: Airbus OneAtlas OneAtlas Radar API — Sar/Replication
  description: 'Airbus OneAtlas OneAtlas Radar API — Sar/Replication. 3 operations. Lead operation: Airbus OneAtlas Download
    Complete Catalogue. Self-contained Naftiko capability covering one Airbus Oneatlas business surface.'
  tags:
  - Airbus Oneatlas
  - Sar/Replication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AIRBUS_ONEATLAS_API_KEY: AIRBUS_ONEATLAS_API_KEY
capability:
  consumes:
  - type: http
    namespace: oneatlas-radar-sar-replication
    baseUri: https://sar.api.oneatlas.airbus.com/v1
    description: Airbus OneAtlas OneAtlas Radar API — Sar/Replication business capability. Self-contained, no shared references.
    resources:
    - name: sar-catalogue-download
      path: /sar/catalogue/download
      operations:
      - name: get
        method: GET
        description: Airbus OneAtlas Download Complete Catalogue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sar-catalogue-replication
      path: /sar/catalogue/replication
      operations:
      - name: get
        method: GET
        description: Airbus OneAtlas Replicate Catalogue
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: sar-catalogue-revocation
      path: /sar/catalogue/revocation
      operations:
      - name: get
        method: GET
        description: Airbus OneAtlas Get Catalogue Revocations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.AIRBUS_ONEATLAS_USER}}'
      password: '{{env.AIRBUS_ONEATLAS_PASS}}'
  exposes:
  - type: rest
    namespace: oneatlas-radar-sar-replication-rest
    port: 8080
    description: REST adapter for Airbus OneAtlas OneAtlas Radar API — Sar/Replication. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/sar/catalogue/download
      name: sar-catalogue-download
      description: REST surface for sar-catalogue-download.
      operations:
      - method: GET
        name: get
        description: Airbus OneAtlas Download Complete Catalogue
        call: oneatlas-radar-sar-replication.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sar/catalogue/replication
      name: sar-catalogue-replication
      description: REST surface for sar-catalogue-replication.
      operations:
      - method: GET
        name: get
        description: Airbus OneAtlas Replicate Catalogue
        call: oneatlas-radar-sar-replication.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/sar/catalogue/revocation
      name: sar-catalogue-revocation
      description: REST surface for sar-catalogue-revocation.
      operations:
      - method: GET
        name: get
        description: Airbus OneAtlas Get Catalogue Revocations
        call: oneatlas-radar-sar-replication.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: oneatlas-radar-sar-replication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airbus OneAtlas OneAtlas Radar API — Sar/Replication. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: airbus-oneatlas-download-complete-catalogue
      description: Airbus OneAtlas Download Complete Catalogue
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: oneatlas-radar-sar-replication.get
      outputParameters:
      - type: object
        mapping: $.
    - name: airbus-oneatlas-replicate-catalogue
      description: Airbus OneAtlas Replicate Catalogue
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: oneatlas-radar-sar-replication.get
      outputParameters:
      - type: object
        mapping: $.
    - name: airbus-oneatlas-get-catalogue-revocations
      description: Airbus OneAtlas Get Catalogue Revocations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: oneatlas-radar-sar-replication.get
      outputParameters:
      - type: object
        mapping: $.
