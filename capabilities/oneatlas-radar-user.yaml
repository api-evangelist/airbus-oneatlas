naftiko: 1.0.0-alpha2
info:
  label: Airbus OneAtlas OneAtlas Radar API — User
  description: 'Airbus OneAtlas OneAtlas Radar API — User. 1 operations. Lead operation: Airbus OneAtlas Return Account Information
    of the Current User. Self-contained Naftiko capability covering one Airbus Oneatlas business surface.'
  tags:
  - Airbus Oneatlas
  - User
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AIRBUS_ONEATLAS_API_KEY: AIRBUS_ONEATLAS_API_KEY
capability:
  consumes:
  - type: http
    namespace: oneatlas-radar-user
    baseUri: https://sar.api.oneatlas.airbus.com/v1
    description: Airbus OneAtlas OneAtlas Radar API — User business capability. Self-contained, no shared references.
    resources:
    - name: user-whoami
      path: /user/whoami
      operations:
      - name: get
        method: GET
        description: Airbus OneAtlas Return Account Information of the Current User
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.AIRBUS_ONEATLAS_USER}}'
      password: '{{env.AIRBUS_ONEATLAS_PASS}}'
  exposes:
  - type: rest
    namespace: oneatlas-radar-user-rest
    port: 8080
    description: REST adapter for Airbus OneAtlas OneAtlas Radar API — User. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/user/whoami
      name: user-whoami
      description: REST surface for user-whoami.
      operations:
      - method: GET
        name: get
        description: Airbus OneAtlas Return Account Information of the Current User
        call: oneatlas-radar-user.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: oneatlas-radar-user-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airbus OneAtlas OneAtlas Radar API — User. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: airbus-oneatlas-return-account-information
      description: Airbus OneAtlas Return Account Information of the Current User
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: oneatlas-radar-user.get
      outputParameters:
      - type: object
        mapping: $.
