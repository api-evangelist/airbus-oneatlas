openapi: 3.2.0
info:
  title: Airbus Oneatlas Catalog search API
  contact:
    email: intelligence-customertechnicalsupport@fr.airbus.com
    name: API support
    url: https://oneatlas.airbus.com
  version: '1.0'
  description: 'Operations tagged Catalog search across 3 of this provider''s published API definitions: oneatlas-data-living-library-openapi.yml, oneatlas-data-pay-per-order-api-openapi.yml, oneatlas-data-pay-per-order-tasking-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: API server
  url: https://data.api.oneatlas.airbus.com
- description: API server
  url: https://order.api.oneatlas.airbus.com
tags:
- name: Catalog search
paths:
  /api/v2/opensearch/description.xml:
    get:
      summary: Opensearch Description Xml
      description: Get opensearch description document
      tags:
      - Catalog search
      servers:
      - description: Prod search server
        url: https://search.foundation.api.oneatlas.airbus.com
      x-roles:
      - admin
      - user
      - signedUrl
      parameters:
      - $ref: '#/components/parameters/CorrelationID'
      responses:
        '200':
          description: Updated
          content:
            application/xml: {}
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
    servers:
    - description: API server
      url: https://data.api.oneatlas.airbus.com
  /api/v2/opensearch:
