components:
  schemas:
    search-options:
      type: object
      properties:
        bbox:
          type: string
          description: 'The geographic search area expressed as a bbox string (decimal

            degrees values  separated by a comma). Values are min lon,min lat,

            max lon, max lat.

            '
          example: 1.8292,48.5821,2.9718,49.0811
        geometry:
          description: The geographic search area.
          example: POLYGON((1 1,5 1,5 5,1 5,1 1))
          anyOf:
          - type: string
            title: WKT
            description: Allowed types -> Point, LineString, Polygon, MultiLineString, MultiPolygon
            example: POLYGON((1 1,5 1,5 5,1 5,1 1))
          - type: object
            title: GeoJSON
            example: '{type: "Polygon", coordinates: [[1, 1], [5, 1], [5, 5], [1, 5], [1, 1]]}

              '
            oneOf:
            - $ref: '#/components/schemas/geo-json-point'
            - $ref: '#/components/schemas/geo-json-linestring'
            - $ref: '#/components/schemas/geo-json-polygon'
            - $ref: '#/components/schemas/geo-json-multilinestring'
            - $ref: '#/components/schemas/geo-json-multipolygon'
        q:
          type: string
          description: 'A generic query parameter which will be searched in full text of the items.

            It may contains `AND` and `OR` operators to specify multiple queries.

            '
          example: PHR AND OPTICAL
        acquisitionDate:
          description: The acquisition date or the acquisition date range.
          oneOf:
          - type: string
            format: date-time
            description: The acquisition date.
            example: '2017-08-29T00:00:00Z'
          - type: string
            format: date-time-range
            description: "The acquisition dates range.\n\nRanges are expressed as follow:\n  - Comma to separate start value from end value\n  - Start value or end value can be omitted (it means values are infinite)\n  - Start with `[` means *start value is included*\n  - Start with `]` means *start value is excluded*\n  - End with `[` means *end value is included*\n  - End with `]` means *end value is excluded*\n"
            example: '[2017-08-29T00:00:00Z'
        acquisitionStation:
