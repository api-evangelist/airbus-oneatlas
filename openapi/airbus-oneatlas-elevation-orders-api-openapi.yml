                              type:
                                type: string
                                example: MultiPolygon
                                enum:
                                - MultiPolygon
                              coordinates:
                                type: array
                                minItems: 1
                                example:
                                - - - 9.3
                                    - 47.7
                                  - - 9.4
                                    - 47.7
                                  - - 9.4
                                    - 47.65
                                  - - 9.3
                                    - 47.7
                                items:
                                  type: array
                                  minItems: 1
                                  items:
                                    description: Closed ring of four or more positions. First and last position must be identical.
                                    type: array
                                    minItems: 4
