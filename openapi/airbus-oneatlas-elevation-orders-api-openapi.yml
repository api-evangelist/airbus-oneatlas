                                description: Basic geometry type describing longitude and latitude
                                type: array
                                minItems: 2
                                items:
                                  type: number
                                example:
                                - 9.3
                                - 47.7
                        - description: The GeoJSON Polygon
                          type: object
                          required:
                          - type
                          - coordinates
                          properties:
                            type:
                              type: string
                              example: Polygon
                              enum:
                              - Polygon
                            coordinates:
                              type: array
                              minItems: 1
                              items:
                                description: Closed ring of four or more positions. First and last position must be identical.
                                type: array
                                minItems: 4
                                items:
                                  description: Basic geometry type describing longitude and latitude
                                  type: array
                                  minItems: 2
                                  items:
                                    type: number
                                  example:
