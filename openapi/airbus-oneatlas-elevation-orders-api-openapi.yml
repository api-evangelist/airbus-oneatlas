openapi: 3.2.0
info:
  title: Airbus Oneatlas Elevation/orders API
  version: 1.0.1
  contact:
    email: dl-geo-webservices@airbus.com
  description: 'Operations tagged elevation/orders across 2 of this provider''s published API definitions: airbus-oneatlas-worlddem-api-openapi.yml, oneatlas-worlddem-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sar.api.oneatlas.airbus.com/v1
  description: OneAtlas - Elevation
security:
- basicAuth: []
tags:
- name: elevation/orders
  description: "All operations needed to order DEM data:\n  * place orders\n  * show placed orders\n  * download purchased data\n"
paths:
  /elevation/orders:
    post:
      summary: Create New Order
      tags:
      - elevation/orders
      requestBody:
        description: Data to be ordered. Multiple items can be placed in the "items" part. After requesting a price, the response can be sent to order data. Instead of requesting a price first, it is possible to set min-/max-Filter to avoid orders that exceed those limits.
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
              - type: object
                required:
                - items
                - kind
                properties:
                  kind:
                    type: string
                    enum:
                    - order.item
                    - order
                  title:
                    type: string
                    maxLength: 32
                    pattern: ^([a-zA-Z0-9 _-]{0,32})$
                    description: user defined title of an order to ease the identification of an order (max. 32 characters)
                    example: Friedrichshafen
                  customer:
                    type: string
                    description: name of the user's end customer (only relevant for resellers)
                    example: Airbus Intelligence Germany
                  items:
                    type: array
                    required:
                    - itemType
                    items:
                      type: object
                      required:
                      - aoi
                      - itemType
                      properties:
                        crsCode:
                          type: string
                          example: urn:ogc:def:crs:EPSG::4326
                        itemFormat:
                          type: string
                          description: output format for area (GeoJSON only for Point, GeoTIFF only for Polygon)
                          enum:
                          - GeoTIFF
                          - GeoJSON
                        itemType:
                          type: string
                          enum:
                          - dem.wddsm
                          - dem.wd4o
                          - dem.wddtmlite
                          - dem.wdneo
                          - dem.wd30
                          - dem.wdneodtm
                        aoi:
                          oneOf:
                          - description: The GeoJSON Point
                            type: object
                            required:
                            - type
                            - coordinates
                            properties:
                              type:
                                type: string
                                example: Point
                                enum:
                                - Point
                              coordinates:
                                description: Basic geometry type describing longitude and latitude
                                type: array
                                minItems: 2
                                items:
                                  type: number
                                example:
                                - 9.3
                                - 47.7
                          - description: The GeoJSON MultiPoint (currently **not implemented**)
                            type: object
                            required:
                            - type
                            - coordinates
                            properties:
                              type:
                                type: string
                                example: MultiPoint
                                enum:
                                - MultiPoint
                              coordinates:
                                type: array
                                minItems: 1
                                items:
                                  description: Basic geometry type describing longitude and latitude
                                  type: array
                                  minItems: 2
                                  items:
                                    type: number
                                  example:
                                  - 9.3
                                  - 47.7
                          - description: The GeoJSON Polygon
                            type: object
                            required:
                            - type
                            - coordinates
                            properties:
                              type:
                                type: string
                                example: Polygon
                                enum:
                                - Polygon
                              coordinates:
                                type: array
                                minItems: 1
                                items:
                                  description: Closed ring of four or more positions. First and last position must be identical.
                                  type: array
                                  minItems: 4
                                  items:
                                    description: Basic geometry type describing longitude and latitude
                                    type: array
                                    minItems: 2
                                    items:
                                      type: number
                                    example:
                                    - 9.3
                                    - 47.7
                                  example:
                                  - - 9.3
                                    - 47.7
                                  - - 9.3
                                    - 47.2
                                  - - 9.5
                                    - 47.2
                                  - - 9.5
                                    - 47.7
                                  - - 9.3
                                    - 47.7
