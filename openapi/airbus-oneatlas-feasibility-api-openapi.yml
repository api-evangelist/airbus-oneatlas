openapi: 3.2.0
info:
  contact:
    email: intelligence-customertechnicalsupport@fr.airbus.com
    name: API support
    url: https://oneatlas.airbus.com
  title: OneAtlas Data Living Library Feasibility API
  description: OneAtlas Data Living Library is a platform that provides users with access to a diverse range of geospatial data and satellite imagery.
servers:
- description: API server
  url: https://data.api.oneatlas.airbus.com
tags:
- name: Feasibility
paths:
  /api/v1/feasibility:
    post:
      summary: Get Feasibility
      tags:
      - Feasibility
      description: '### Ask for a feasibility request

        As of today, the API does not cover all cases properly meaning that it could answer that the request is feasible when it is not.


        Please take the following precautions :

        - ONENOWATTEMPTS should be between 3 and 14 days

        - ONEDAY should be on a time period where at least 1 acquisition is planned and maximum 1 day

        - If you want to be sure, you can use the get attempts path (../api/v1/attempts)'
      requestBody:
        content:
          application/json:
            schema:
              description: Feasibility request
              oneOf:
              - properties:
                  progTypeNames:
                    $ref: '#/components/schemas/progTypeNames'
                  mission:
                    enum:
                    - PLEIADESNEO
                    type: string
                  contractId:
                    type: string
                  acquisitionDate:
                    $ref: '#/components/schemas/AcquisitionDate'
                  optical:
                    $ref: '#/components/schemas/Optical'
                  aoi:
                    $schema: http://json-schema.org/draft-06/schema#
                    id: http://local/schemas/public/aoi.json#
                    properties:
                      coordinates:
                        items:
                          items:
                            items:
                              type: number
                            maxItems: 2
                            minItems: 2
                            type: array
                          minItems: 4
                          type: array
                        minItems: 1
                        type: array
                      type:
                        enum:
                        - Polygon
                    title: aoi
                    type: object
                required:
                - progTypeNames
                - mission
                - contractId
                - acquisitionDate
                - optical
                - aoi
                type: object
              example:
                progTypeNames:
                - ONEPLAN
                mission: PLEIADESNEO
                contractId: CTR2100XXXX
                acquisitionDate:
                  startDate: '2021-08-31T19:22:11.250Z'
                  endDate: '2021-09-30T23:59:59.999Z'
                optical:
                  acquisitionMode: MONO
                  maxCloudCover: 20
                  maxIncidenceAngle: 30
                aoi:
                - - - -3.71612548828124
                    - 40.35910267579197
                  - - -3.6090087890624893
                    - 40.35910267579197
                  - - -3.6090087890624893
                    - 40.45739708775443
                  - - -3.71612548828124
                    - 40.45739708775443
                  - - -3.71612548828124
                    - 40.35910267579197
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feasibility'
              example:
                progCapacities:
                  mission: PLEIADESNEO
                  progTypes:
                  - name: ONEPLAN
                    mission: PLEIADESNEO
                    feasibility:
                      automation: AUTOMATIC
                      classification: CHALLENGING
                    available: true
                    expirationDate: '2021-08-31T16:22:11.250Z'
      servers:
      - description: Tasking API server
        url: https://task.api.oneatlas.airbus.com
      operationId: postApiV1Feasibility
      x-operation-id-source: derived
components:
  schemas:
    Optical:
      properties:
        acquisitionMode:
          enum:
          - MONO
          - STEREO
          - TRISTEREO
          type: string
        maxCloudCover:
          format: float
          type: number
        maxIncidenceAngle:
          format: float
          type: number
    Feasibility:
      type: object
      properties:
        progCapacities:
          items:
            properties:
              mission:
                enum:
                - PLEIADESNEO
                type: string
              progTypes:
                items:
                  properties:
                    name:
                      type: string
                    mission:
                      enum:
                      - PLEIADESNEO
                      type: string
                    feasibility:
                      properties:
                        automation:
                          description: To be used when creating the order and/or requesting the quotation
                          enum:
                          - AUTOMATIC
                          - MANUAL
                          type: string
                        classification:
                          description: To be used when creating the order and/or requesting the quotation
                          enum:
                          - CHALLENGING
                          - EASY
                          type: string
                      type: object
                    available:
                      type: boolean
                    expirationDate:
                      format: datetime
                      type: string
                  type: object
                type: array
            type: object
          type: array
    AcquisitionDate:
      type: object
      properties:
        startDate:
          type: string
          format: datetime
          pattern: ^yyyy-MM-dd'T'HH:mm:ss.SSS'Z$
          description: Defines the acquisition start date. The parameter can be set at any time. Note that if the parameter is set in the past, the value is replaced by the current date
        endDate:
          type: string
          format: datetime
          pattern: ^yyyy-MM-dd'T'HH:mm:ss.SSS'Z$
          description: Defines the acquisition end date
    progTypeNames:
      items:
        enum:
        - ONEDAY
        - ONEPLAN
        - ONENOWATTEMPTS
        - ONENOWWEATHER
        default: ONEPLAN
        type: string
      type: array
x-tagGroups:
- name: Authentication
  tags:
  - APIkey management
  - Token retrieval
- name: Catalog search
  tags:
  - Catalog search
- name: Living Library ordering
  tags:
  - Orders
  - Subscriptions
