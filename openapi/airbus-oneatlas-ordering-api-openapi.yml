openapi: 3.2.0
info:
  title: Airbus Oneatlas Ordering API
  contact:
    email: intelligence-customertechnicalsupport@fr.airbus.com
    name: API support
    url: https://oneatlas.airbus.com
  version: '1.0'
  description: 'Operations tagged Ordering across 2 of this provider''s published API definitions: oneatlas-data-pay-per-order-api-openapi.yml, oneatlas-data-pay-per-order-tasking-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- description: API server
  url: https://order.api.oneatlas.airbus.com
tags:
- name: Ordering
paths:
  /api/v1/feasibility:
    post:
      summary: Check Feasibility
      tags:
      - Ordering
      requestBody:
        content:
          application/json:
            schema:
              description: Feasibility request
              oneOf:
              - title: PleiadesNeo
                properties:
                  progTypeNames:
                    enum:
                    - ONEPLAN
                    - ONEDAY
                    - ONENOWATTEMPTS
                    - ONENOWWEATHER
                    type: string
                  mission:
                    enum:
                    - PLEIADESNEO
                    type: string
                  contractId:
                    type: string
                  acquisitionDate:
                    $ref: '#/components/schemas/AcquisitionDate'
                  optical:
                    $ref: '#/components/schemas/Optical'
                  aoi:
                    $schema: http://json-schema.org/draft-06/schema#
                    id: http://local/schemas/public/aoi.json#
                    properties:
                      coordinates:
                        items:
                          items:
                            items:
                              type: number
                            maxItems: 2
                            minItems: 2
                            type: array
                          minItems: 4
                          type: array
                        minItems: 1
                        type: array
                      type:
                        enum:
                        - Polygon
                    title: aoi
                    type: object
                required:
                - progTypeNames
                - mission
                - contractId
                - acquisitionDate
                - optical
                - aoi
                type: object
                example:
                  progTypeNames:
                  - ONEPLAN
                  mission: PLEIADESNEO
                  contractId: CTR2100XXXX
                  acquisitionDate:
                    startDate: '2021-08-31T19:22:11.250Z'
                    endDate: '2021-09-30T23:59:59.999Z'
                  optical:
                    acquisitionMode: MONO
                    maxCloudCover: 20
                    maxIncidenceAngle: 30
                  aoi:
                  - - - -3.71612548828124
                      - 40.35910267579197
                    - - -3.6090087890624893
                      - 40.35910267579197
                    - - -3.6090087890624893
                      - 40.45739708775443
                    - - -3.71612548828124
                      - 40.45739708775443
                    - - -3.71612548828124
                      - 40.35910267579197
              - title: Pleiades and SPOT
                properties:
                  progTypeNames:
                    enum:
                    - ONEPLAN
                    - ONEDAY
                    - ONENOW
                    - ONESERIES
                    type: string
                  mission:
                    $ref: '#/components/schemas/Mission'
                  contractId:
                    type: string
                  acquisitionDate:
                    $ref: '#/components/schemas/AcquisitionDate'
                  optical:
                    $ref: '#/components/schemas/Optical'
                  aoi:
                    $schema: http://json-schema.org/draft-06/schema#
                    id: http://local/schemas/public/aoi.json#
                    properties:
                      coordinates:
                        items:
                          items:
                            items:
                              type: number
                            maxItems: 2
                            minItems: 2
                            type: array
                          minItems: 4
                          type: array
                        minItems: 1
                        type: array
                      type:
                        enum:
                        - Polygon
                    title: aoi
                    type: object
                required:
                - progTypeNames
                - mission
                - contractId
                - acquisitionDate
                - optical
                - aoi
                type: object
                example:
                  progTypeNames:
                  - ONEPLAN
                  mission: PLEIADES
                  contractId: CTR2100XXXX
                  acquisitionDate:
                    startDate: '2021-08-31T19:22:11.250Z'
                    endDate: '2021-09-30T23:59:59.999Z'
                  optical:
                    acquisitionMode: MONO
                    maxCloudCover: 20
                    maxIncidenceAngle: 30
                  aoi:
                  - - - -3.71612548828124
                      - 40.35910267579197
                    - - -3.6090087890624893
                      - 40.35910267579197
                    - - -3.6090087890624893
                      - 40.45739708775443
                    - - -3.71612548828124
                      - 40.45739708775443
                    - - -3.71612548828124
                      - 40.35910267579197
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - title: SPOT & Pleiades
                  type: object
                  properties:
                    progCapacities:
                      type: array
                      items:
                        type: object
                        properties:
                          mission:
                            $ref: '#/components/schemas/Mission'
                          progTypes:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  enum:
                                  - ONEPLAN
                                  - ONEDAY
                                  - ONENOW
                                  - ONESERIES
                                  type: string
                                mission:
                                  $ref: '#/components/schemas/Mission'
                                feasibility:
                                  type: object
                                  properties:
                                    classification:
                                      type: string
                                      enum:
                                      - EASY
                                      - CHALLENGING
                                    automation:
                                      type: string
                                      enum:
                                      - AUTOMATIC
                                      - MAUAL
                                    automationName:
                                      type: string
                                available:
                                  type: boolean
                - title: PleiadesNeo
                  type: object
                  properties:
                    progCapacities:
                      type: array
                      items:
                        type: object
                        properties:
                          mission:
                            type: string
                            enum:
                            - PLEIADESNEO
                          progTypes:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  enum:
                                  - ONEPLAN
                                  - ONEDAY
                                  - ONENOWATTEMPTS
                                  - ONENOWWEATHER
                                  type: string
                                mission:
                                  type: string
                                  enum:
                                  - PLEIADESNEO
                                feasibility:
                                  type: object
                                  properties:
                                    classification:
                                      type: string
                                      enum:
                                      - EASY
                                      - CHALLENGING
                                    automation:
                                      type: string
                                      enum:
                                      - AUTOMATIC
                                      - MAUAL
                                    automationName:
                                      type: string
                                available:
                                  type: boolean
                                expirationDate:
                                  type: string
                                  format: datetime
                                  pattern: ^yyyy-MM-dd'T'HH:mm:ss.SSS'Z$
              examples:
                SPOT & Pleiades:
                  value:
                    progCapacities:
                    - mission: PLEIADES
                      progTypes:
                      - name: ONEPLAN
                        mission: PLEIADES
                        feasibility:
                          classification: CHALLENGING
                          automation: AUTOMATIC
                          automationName: AutomaticTasking30
                        available: true
                PleiadesNeo:
                  value:
                    progCapacities:
                    - mission: PLEIADESNEO
                      progTypes:
                      - name: ONEPLAN
                        mission: PLEIADESNEO
                        feasibility:
                          classification: CHALLENGING
                          automation: AUTOMATIC
                        available: true
                        expirationDate: '2021-05-12T08:03:19.052Z'
      servers:
      - description: Tasking API server
        url: https://order.api.oneatlas.airbus.com
    servers:
    - description: API server
      url: https://order.api.oneatlas.airbus.com
