                    currency: EUR
                    discountPercentage: 0
                    discountValue: 0
                    totalAmount: 7600
                PleiadesNeo:
                  value:
                    quotationId: QUO21000243
                    currency: EUR
                    discountPercentage: 0
                    discountValue: 0
