components:
  schemas:
    SegmentKey:
      type: string
      description: The segmentKey is the value of the property "segmentKey" of the selected acquisition from the attempt request
    dem:
      type: object
      title: digital elevation model
      properties:
        key:
          enum:
          - dem_i
        value:
          description: Defines the digital elevation model, i refers to the aoi's id (To be filled only if processing_level = ortho)
          enum:
          - best_available
          - FLAT_DEM_WITH_GTOPO30_WAT
          - FLAT_DEM_WITH_WAT
          - GTOPO30
          - MIXEDDEM
          - PAS-DEM
          - PAS-DEM_IVV
          - REF3D-DEM
          - REF3D-DEM_IVV
          - SRTMV4
          - SRTMV4_IVV
    TaskingAttempt:
      type: array
      items:
        type: object
        properties:
          mission:
            enum:
            - PLEIADESNEO
            type: string
          progTypes:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                mission:
                  enum:
                  - PLEIADESNEO
                  type: string
                segments:
                  type: array
                  items:
                    $ref: '#/components/schemas/segment'
                available:
                  type: boolean
    Optical:
      properties:
        acquisitionMode:
          enum:
          - MONO
          - STEREO
          - TRISTEREO
          type: string
        maxCloudCover:
          format: float
          type: number
        maxIncidenceAngle:
          format: float
          type: number
    segment:
      type: object
      properties:
        id:
          type: string
        footprint:
          $ref: '#/components/schemas/footprint'
        instrumentMode:
          type: string
        orderDeadline:
          format: datetime
          type: string
        extendedAngle:
          type: boolean
        acquisitionStartDate:
          format: datetime
          type: string
        acquisitionEndDate:
          format: datetime
          type: string
        incidenceAngle:
          format: float
          type: number
        segmentKey:
          type: string
        acrossTrackIncidenceAngle:
          format: float
          type: number
        maxIncidenceAngle:
          format: float
          type: number
    NoSensorAvailable:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                example: ERR_NO_SENSOR_AVAILABLE
                type: string
              locator:
                example: UNKNOWN
                type: string
    pixelCoding:
      type: object
      title: pixel_coding
      properties:
        key:
          enum:
          - pixel_coding
        value:
          enum:
          - 8bits
          - 12bits
          description: Defines the pixel coding. <br>'8bits' when radiometric_processing = 'display'<br>, '12bits' otherwise
    Channels:
      type: array
      items:
        type: object
        properties:
          type:
            type: string
            enum:
            - email
          addressee:
            type: object
            properties:
              to:
                type: array
                items:
                  type: string
                description: 'recipients: list of people that need to receive notification regarding the tasking'
              cc:
                type: array
                items:
                  type: string
                description: list of people being in copy
    deliveryPNEO:
      type: object
      properties:
        type:
          type: string
          enum:
          - network
    AcquisitionDate:
      type: object
      properties:
        startDate:
          type: string
          format: datetime
          pattern: ^yyyy-MM-dd'T'HH:mm:ss.SSS'Z$
          description: Defines the acquisition start date. The parameter can be set at any time. Note that if the parameter is set in the past, the value is replaced by the current date
        endDate:
          type: string
          format: datetime
          pattern: ^yyyy-MM-dd'T'HH:mm:ss.SSS'Z$
          description: Defines the acquisition end date
    footprint:
      type: object
      properties:
        geometry:
          type: string
          example: POLYGON((23.642028 38.043069, 23.642495 37.909283, 23.868104 37.908839, 23.868548 38.04307, 23.642028 38.043069, 23.642028 38.043069))
        center:
          type: string
          example: POINT(23.755357 37.97611)
    AcqPerod:
      type: string
      pattern: ^yyyy-MM-dd'T'HH:mm:ss.SSS'Z yyyy-MM-dd'T'HH:mm:ss.SSS'Z$
      description: Defines the acquisition period
      format: datetime
    DataSourceIds:
      type: array
      items:
        type: object
        properties:
          catalogId:
            enum:
            - PublicMOC
          catalogItemId:
            type: string
    GeojsonGeometry:
      externalDocs:
        url: http://geojson.org/geojson-spec.html#geometry-objects
