      responses:
        '201':
          content:
            application/json:
              schema:
                oneOf:
                - title: SPOT & Pleiades
                  properties:
                    salesOrderId:
                      $ref: '#/components/schemas/salesOrderId'
                    currency:
                      type: string
                    discountPercentage:
                      format: float
                      type: number
                    discountValue:
                      format: float
                      type: number
                    totalAmount:
                      format: float
                      type: number
                - title: PleiadesNeo
                  properties:
                    quotationId:
