          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                example:
                  message: 'Authentication failed (cause: Token expired)'
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                properties:
                  errorCode:
                    type: string
                  message:
                    type: string
                example:
                  errorCode: E2203
                  message: CIS contract 'contract_name' not found.
