                                - mission
                                - acquisitionId
                                - startTime
                                - stopTime
                                - sensorMode
                                - polarizationChannels
                                - beamId
                                - pathDirection
                                - lookDirection
                                - incidenceAngle
                                - lastUpdateTime
                                - status
                                - outOfFullPerformance
                                properties:
                                  itemId:
                                    type: string
                                    format: uuid
                                  mission:
                                    description: Satellite mission
                                    type: string
                                    enum:
                                    - TSX
                                    - PAZ
                                  satellite:
                                    description: Satellite
                                    type: string
                                    enum:
                                    - TSX-1
                                    - PAZ-1
                                    - TDX-1
                                  acquisitionId:
                                    type: string
                                    example: TSX-1_ST_S_spot_049R_49677_D31767159_432
                                  groupId:
                                    type: integer
                                  startTime:
                                    type: string
                                    format: date-time
                                  stopTime:
                                    type: string
                                    format: date-time
                                  sensorMode:
                                    description: The imaging/instrument/sensor mode to use for the acquisition
                                    type: string
                                    enum:
                                    - SAR_ST_S
                                    - SAR_HS_S
                                    - SAR_HS_S_300
                                    - SAR_HS_S_150
                                    - SAR_HS_D
                                    - SAR_HS_D_300
                                    - SAR_HS_D_150
                                    - SAR_SL_S
                                    - SAR_SL_D
                                    - SAR_SM_S
                                    - SAR_SM_D
                                    - SAR_SC_S
                                    - SAR_WS_S
                                    example: SAR_SM_S
                                  polarizationChannels:
                                    description: The dual-polarization modes (HHVV, HHHV, VVVH) are not available for staring spotlight or (wide) ScanSAR modes. The polarization modes HV and VH are only available for Wide ScanSAR acquisitions.
                                    type: string
                                    enum:
                                    - HH
                                    - VV
                                    - HV
                                    - VH
                                    - HHVV
                                    - HHHV
                                    - VVVH
                                    example: HH
                                  beamId:
                                    type: string
                                    example: strip_010
                                  pathDirection:
                                    description: Path or orbit direction
                                    type: string
                                    example: ascending
                                    enum:
                                    - ascending
                                    - descending
                                  lookDirection:
                                    description: Look Direction. Left-looking acquisitions require special authorization.
                                    type: string
                                    enum:
                                    - R
                                    - L
                                  incidenceAngle:
                                    description: Incidence angle range in degrees. Only acquisitions with an average incidence angle in this range will be considered.
                                    type: object
                                    additionalProperties: false
                                    properties:
                                      minimum:
                                        type: number
                                        minimum: 10
                                        maximum: 70
                                        example: 30
                                      maximum:
                                        type: number
                                        minimum: 10
                                        maximum: 70
                                        example: 50
                                  productType:
                                    description: Product type for the processing of the acuqisition. Mandatory on placing the order, but not for feasibility.
                                    type: string
                                    enum:
                                    - SSC
                                    - MGD
                                    - GEC
                                    - EEC
                                    example: EEC
                                  resolutionVariant:
                                    description: Radiometric or spatial enhancement. Mandatory on placing the order, but not for feasibility.
                                    type: string
                                    enum:
                                    - SE
                                    - RE
                                  orbitType:
                                    description: Near Realtime acquisitions will incur an additional fee. Science processing is most accurate but takes approx 5 days to complete. Mandatory on placing the order, but not for feasibility.
                                    type: string
                                    enum:
                                    - NRT
                                    - rapid
                                    - science
                                  geocodedIncidenceMask:
                                    description: Include GIM in delivered product. Only applicable for EEC products.
                                    type: boolean
                                    default: false
                                  mapProjection:
                                    description: Projection of the delivered product. Mandatory on placing the order, but not for feasibility.
                                    type: string
                                    default: auto
                                    enum:
                                    - auto
                                    - UTM
                                    - UPS
                                  gainAttenuation:
                                    description: Processor gain Attenuation. Mandatory on placing the order, but not for feasibility.
                                    type: integer
                                    default: 0
                                    enum:
                                    - 0
                                    - 10
                                    - 20
                                  relativeOrbit:
                                    type: integer
                                  absoluteOrbit:
                                    type: integer
                                  orderTemplate:
                                    type: string
                                  lastUpdateTime:
                                    type: string
                                    format: date-time
                                  status:
                                    description: Status of item
                                    type: string
                                    enum:
                                    - feasible
                                    - availableInArchive
                                    - unavailable
                                    - submitted
                                    - waitingForAcquisitionApproval
                                    - accepted
                                    - planned
                                    - acquistion
                                    - transition
                                    - downlink
                                    - waitingForOrbit
                                    - processing
                                    - waitingForDeliveryApproval
                                    - delivery
                                    - completed
                                    - failed
                                    - cancelled
                                    - approvalRejected
                                  sensitivity:
                                    type: object
                                    additionalProperties: false
                                    required:
                                    - status
                                    properties:
                                      status:
                                        type: string
                                        enum:
                                        - notSensitive
                                        - potential
                                        - sensitive
                                      missingParameters:
                                        description: parameters that need to be set to get definite sensitivity status
                                        type: array
                                        items:
                                          type: string
                                          enum:
                                          - productType
                                          - resolutionVariant
                                        example:
                                        - productType
                                        - resolutionVariant
                                      type:
                                        type: string
                                        enum:
                                        - blacklist
                                        - resolution
                                      sensitivityInformation:
                                        type: string
                                  itemType:
                                    type: string
                                    enum:
                                    - catalogue
                                    - future
                                  outOfFullPerformance:
                                    description: If set to true and the account is authorized, out of full performance scenes will be included in the response.
                                    type: boolean
                                    default: false
                                  scienceOrbitAvailability:
                                    type: boolean
                          - type: object
                            properties:
                              properties:
                                type: object
                                properties:
                                  submissionDeadline:
                                    type: string
                                    format: date-time
                                  acquisitionOnly:
                                    description: Acquisition is done and archived, but product will not be processed and deliverd. Requires special authorization.
                                    type: boolean
                                    default: false
                                  priority:
                                    description: Higher priority orders have a better chance of success but incur an additional fee
                                    type: string
                                    enum:
                                    - standard
                                    - priority
                                    - exclusive
                                    example: standard
                                  conflicts:
                                    type: object
                                    properties:
                                      status:
                                        type: string
                                        enum:
                                        - none
                                        - potential
                                        - expected
                                      external:
                                        type: object
                                        additionalProperties:
                                          type: object
                                          properties:
                                            status:
                                              type: string
                                              enum:
                                              - none
                                              - potential
                                              - expected
                                            startTime:
                                              type: string
                                              format: date-time
                                            stopTime:
                                              type: string
                                              format: date-time
                                          minLength: 1
                                      baskets:
                                        type: object
                                        additionalProperties:
                                          type: object
                                          additionalProperties:
                                            type: object
                                            properties:
                                              status:
                                                type: string
                                                enum:
                                                - none
                                                - potential
                                                - expected
                                              startTime:
                                                type: string
                                                format: date-time
                                              stopTime:
                                                type: string
                                                format: date-time
                                            minLength: 1
                                        minLength: 1
                                      shopcart:
                                        type: object
                                        additionalProperties:
                                          type: object
                                          properties:
                                            status:
                                              type: string
                                              enum:
                                              - none
                                              - potential
                                              - expected
                                            startTime:
                                              type: string
                                              format: date-time
                                            stopTime:
                                              type: string
                                              format: date-time
                                          minLength: 1
                                      feasibility:
                                        type: object
                                        additionalProperties:
                                          type: object
                                          properties:
                                            status:
                                              type: string
                                              enum:
                                              - none
                                              - potential
                                              - expected
                                            startTime:
                                              type: string
                                              format: date-time
                                            stopTime:
                                              type: string
                                              format: date-time
                                          minLength: 1
                                    required:
                                    - status
                                  estimatedDownloadAvailability:
                                    type: string
                                    format: date-time
                                  receivingStation:
                                    description: Downlink station to use for direct-access customers
                                    type: string
                                    default: NSG_POOL
                                    example: NSG_POOL
                        - type: object
                          properties:
                            properties:
                              type: object
                              properties:
                                downlinkTime:
                                  type: string
                                  format: date-time
                                orderId:
                                  type: string
                                  pattern: ^\d{1,9}
                                  example: '12345'
                                orderItemId:
                                  type: string
                                  pattern: ^\d{9}_\d{4}$
                                  example: '000012345_0001'
                      - type: object
