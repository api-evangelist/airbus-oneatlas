                              - mission
                              - acquisitionId
                              - startTime
                              - stopTime
                              - sensorMode
                              - polarizationChannels
                              - beamId
                              - pathDirection
                              - lookDirection
                              - incidenceAngle
                              - lastUpdateTime
                              - status
                              - outOfFullPerformance
                              properties:
