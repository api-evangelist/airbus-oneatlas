                                  - SAR_HS_S
                                  - SAR_HS_S_300
                                  - SAR_HS_S_150
                                  - SAR_HS_D
                                  - SAR_HS_D_300
                                  - SAR_HS_D_150
                                  - SAR_SL_S
                                  - SAR_SL_D
                                  - SAR_SM_S
                                  - SAR_SM_D
                                  - SAR_SC_S
                                  - SAR_WS_S
