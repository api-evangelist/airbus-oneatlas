                                type: object
                                additionalProperties: false
                                required:
                                - type
                                - coordinates
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Polygon
                                  coordinates:
                                    type: array
                                    minLength: 1
                                    items:
                                      type: array
                                      minLength: 3
                                      items:
                                        type: array
                                        minLength: 2
                                        maxLength: 2
                                        items:
                                          type: number
                                example:
                                  type: Polygon
                                  coordinates:
                                  - - - 9.346
                                      - 47.788
                                    - - 9.291
                                      - 47.644
                                    - - 9.538
                                      - 47.592
                                    - - 9.62
                                      - 47.75
                                    - - 9.511
                                      - 47.802
                                    - - 9.346
                                      - 47.788
