                                      description: Price for item including known tax, discounts and fees
                                      type: number
                                      example: 834.32
                                    currency:
                                      type: string
                                      example: EUR
                                    unitPrice:
                                      description: Price for standard scene
                                      type: number
                                      example: 1000
                                    quantity:
                                      type: number
                                      description: Scene length
                                      example: 1.2
                                    discountRate:
                                      type: number
                                      description: Discount for this item in percent
                                      example: 20
                                    expiry:
                                      type: string
                                      format: date-time
                                    fees:
