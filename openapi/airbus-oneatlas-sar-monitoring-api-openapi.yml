openapi: 3.0.3
info:
  title: OneAtlas WorldDEM Access Sar/Monitoring API
  version: 1.0.1
  contact:
    email: dl-geo-webservices@airbus.com
  description: The OneAtlas WorldDEM API is a tool that provides access to high-resolution global elevation data. This data, collected by satellites and processed using advanced technologies, offers a detailed and accurate representation of the Earth's surface. By integrating the WorldDEM API into their applications, users can benefit from precise terrain information for a wide range of use cases, such as urban planning, disaster response, agriculture, and infrastructure development. This API allows developers to easily incorporate elevation data into their projects, enabling them to create more accurate and effective solutions.
servers:
- url: https://sar.api.oneatlas.airbus.com/v1
  description: OneAtlas - Elevation
security:
- basicAuth: []
tags:
- name: Sar/Monitoring
  description: 'Monitor your ordered SAR acquisitions.

    '
paths:
  /sar/orders:
    get:
      summary: Airbus OneAtlas Get List of Orders
      tags:
      - Sar/Monitoring
      responses:
        '200':
          description: orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - orderId
                  - purpose
                  - submissionTime
                  properties:
                    basketId:
                      type: string
                      format: uuid
                    customerReference:
                      type: string
                      example: O29343
                    orderId:
                      type: string
                      pattern: ^\d{1,9}
                      example: '12345'
                    purpose:
                      type: string
                      description: Order purpose. Mandatory on submitting the shopcart, but not on crate.
                      enum:
                      - Aerospace Industry Company
                      - Agro Company
                      - Agro Service Company
                      - Bank
                      - Consulting Company
                      - Consumer
                      - Cooperative Company
                      - Defence Company
                      - DEM
                      - Edition & Communication Company
                      - Education / Research
                      - Electronic System company
                      - Emergency Response & Crisis Management
                      - Energy Company
                      - Energy Service Company
                      - Engineering Company
                      - Engineering Service Company
                      - Environment
                      - Forest Company
                      - Forest Service Company
                      - Funding Agency
                      - Ground Control Points (GCP)
                      - Hydrology
                      - Infrastructure (Including Construction)
                      - Insurance
                      - International Civil Organization
                      - International Military Organization
                      - IT Service Company
                      - LBS Company
                      - Local Government
                      - Maritime Services
                      - Maritime and Coastal company
                      - Maritime and Coastal Services company
                      - Geology
                      - Mining Company
                      - Mining Service Company
                      - Land Administration
                      - National Civil Government
                      - National Mapping
                      - National Military Government
                      - NGO / NPO / Association
                      - Oil & Gas Company
                      - Oil & Gas Service Company
                      - Other Industry Company
                      - Other
                      - Property & Urban Planning
                      - Public Company
                      - Real Estate / Architect
                      - Space Agency
                      - Surface Movement Monitoring
                      - Telecom Company
                      - Transport Service Company
                      - Utilities, Transport and Engineering
                      - Value-Added Geo-Information Company
                    submissionTime:
                      type: string
                      format: date-time
                    title:
                      type: string
                      example: Lake Constance Test 1
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    pattern: ^[A-Za-z0-9]+[A-Z-a-z0-9_\-]*[A-Za-z0-9]$
                  message:
                    type: string
                  location:
                    type: string
                  detail:
                    type: string
                  params:
                    type: object
        '401':
          description: Authorization information is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    pattern: ^[A-Za-z0-9]+[A-Z-a-z0-9_\-]*[A-Za-z0-9]$
                  message:
                    type: string
                  location:
                    type: string
                  detail:
                    type: string
                  params:
                    type: object
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    pattern: ^[A-Za-z0-9]+[A-Z-a-z0-9_\-]*[A-Za-z0-9]$
                  message:
                    type: string
                  location:
                    type: string
                  detail:
                    type: string
                  params:
                    type: object
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    pattern: ^[A-Za-z0-9]+[A-Z-a-z0-9_\-]*[A-Za-z0-9]$
                  message:
                    type: string
                  location:
                    type: string
                  detail:
                    type: string
                  params:
                    type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    pattern: ^[A-Za-z0-9]+[A-Z-a-z0-9_\-]*[A-Za-z0-9]$
                  message:
                    type: string
                  location:
                    type: string
                  detail:
                    type: string
                  params:
                    type: object
        '503':
          description: Connection to internal service error
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                properties:
                  error:
                    type: string
                    pattern: ^[A-Za-z0-9]+[A-Z-a-z0-9_\-]*[A-Za-z0-9]$
                  message:
                    type: string
                  location:
                    type: string
                  detail:
                    type: string
                  params:
                    type: object
  /sar/orders/{orderIdOrBasketId}:
    parameters:
    - name: orderIdOrBasketId
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Airbus OneAtlas Get Order Details
      tags:
      - Sar/Monitoring
      responses:
        '200':
          description: order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - features
                - orderId
                - purpose
                - submissionTime
                - type
                properties:
