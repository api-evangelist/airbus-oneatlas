      responses:
        '200':
          description: order items as feature collection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - type
                - features
                properties:
                  type:
                    type: string
                    enum:
                    - FeatureCollection
                  limit:
                    type: integer
                    minimum: 1
                    default: 200
                  total:
                    type: integer
                  features:
                    type: array
                    items:
                      allOf:
                      - allOf:
                        - allOf:
                          - type: object
                            properties:
                              properties:
                                type: object
                                properties:
                                  price:
                                    type: object
                                    additionalProperties: false
                                    required:
                                    - final
                                    - total
                                    - currency
                                    properties:
                                      final:
                                        description: Not final, if parameters are missing to calculate all price elements (e.g. Fees). Final price might then be higher.
                                        type: boolean
                                        example: false
                                      missingParameters:
                                        description: parameters that need to be set to get final price
                                        type: array
                                        items:
                                          type: string
                                        example:
                                        - orbitType
                                      total:
                                        description: Price for item including known tax, discounts and fees
                                        type: number
                                        example: 834.32
                                      currency:
                                        type: string
                                        example: EUR
                                      unitPrice:
                                        description: Price for standard scene
                                        type: number
                                        example: 1000
                                      quantity:
                                        type: number
                                        description: Scene length
                                        example: 1.2
                                      discountRate:
                                        type: number
                                        description: Discount for this item in percent
                                        example: 20
                                      expiry:
                                        type: string
                                        format: date-time
                                      fees:
                                        type: array
                                        items:
                                          type: object
                                          additionalProperties: false
                                          required:
                                          - type
                                          - value
                                          properties:
                                            type:
                                              type: string
                                              enum:
                                              - NRT
                                              - Rapid tasking
                                              - Priority
                                              - Cancellation
                                            value:
                                              type: number
                                              description: Fee value
                                              example: '200'
                                            discountRate:
                                              type: number
                                              description: Discount rate applied on fee in percent
                                              example: '10'
                          - type: object
                            required:
                            - type
                            - geometry
                            - properties
                            properties:
                              type:
                                type: string
                                enum:
                                - Feature
