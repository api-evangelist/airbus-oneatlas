  /sar/stacks:
    post:
      summary: Airbus OneAtlas Create Stacks from Template Items
      tags:
      - Sar/Search
      requestBody:
        description: template items for new stacks
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acquisitions:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    example: TSX-1_ST_S_spot_049R_49677_D31767159_432
                items:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                orderTemplate:
                  type: string
                periodicity:
                  type: integer
                  enum:
                  - 11
                  - 22
                  - 33
                  - 44
                  - 55
                  - 66
                  - 77
                  - 88
                  - 99
                occurrences:
                  type: integer
                  minimum: 1
                startTime:
                  type: string
                  format: date-time
                stopTime:
                  type: string
                  format: date-time
              oneOf:
              - required:
                - acquisitions
                - periodicity
                - occurrences
                - startTime
                - stopTime
              - required:
                - items
                - periodicity
                - occurrences
                - startTime
                - stopTime
      responses:
        '200':
          description: items of newly created stacks (not including template items)
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - FeatureCollection
                  features:
                    type: array
                    items:
                      allOf:
                      - allOf:
                        - type: object
                          required:
                          - type
                          - geometry
                          - properties
                          properties:
                            type:
                              type: string
                              enum:
                              - Feature
                            geometry:
                              type: object
                              additionalProperties: false
                              required:
                              - type
                              - coordinates
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Polygon
                                coordinates:
                                  type: array
                                  minLength: 1
                                  items:
                                    type: array
                                    minLength: 3
                                    items:
                                      type: array
                                      minLength: 2
                                      maxLength: 2
                                      items:
                                        type: number
                              example:
                                type: Polygon
                                coordinates:
                                - - - 9.346
                                    - 47.788
                                  - - 9.291
                                    - 47.644
                                  - - 9.538
                                    - 47.592
                                  - - 9.62
                                    - 47.75
                                  - - 9.511
                                    - 47.802
                                  - - 9.346
                                    - 47.788
                            properties:
                              type: object
                              required:
                              - itemId
                              - mission
                              - acquisitionId
                              - startTime
                              - stopTime
                              - sensorMode
                              - polarizationChannels
                              - beamId
                              - pathDirection
                              - lookDirection
                              - incidenceAngle
                              - lastUpdateTime
                              - status
                              - outOfFullPerformance
                              properties:
                                itemId:
                                  type: string
                                  format: uuid
                                mission:
                                  description: Satellite mission
                                  type: string
                                  enum:
                                  - TSX
                                  - PAZ
                                satellite:
                                  description: Satellite
                                  type: string
                                  enum:
                                  - TSX-1
                                  - PAZ-1
                                  - TDX-1
                                acquisitionId:
                                  type: string
                                  example: TSX-1_ST_S_spot_049R_49677_D31767159_432
                                groupId:
                                  type: integer
                                startTime:
                                  type: string
                                  format: date-time
                                stopTime:
                                  type: string
                                  format: date-time
                                sensorMode:
                                  description: The imaging/instrument/sensor mode to use for the acquisition
                                  type: string
                                  enum:
                                  - SAR_ST_S
                                  - SAR_HS_S
                                  - SAR_HS_S_300
                                  - SAR_HS_S_150
                                  - SAR_HS_D
                                  - SAR_HS_D_300
                                  - SAR_HS_D_150
                                  - SAR_SL_S
                                  - SAR_SL_D
                                  - SAR_SM_S
                                  - SAR_SM_D
                                  - SAR_SC_S
                                  - SAR_WS_S
                                  example: SAR_SM_S
                                polarizationChannels:
                                  description: The dual-polarization modes (HHVV, HHHV, VVVH) are not available for staring spotlight or (wide) ScanSAR modes. The polarization modes HV and VH are only available for Wide ScanSAR acquisitions.
                                  type: string
                                  enum:
                                  - HH
                                  - VV
                                  - HV
                                  - VH
                                  - HHVV
                                  - HHHV
                                  - VVVH
                                  example: HH
                                beamId:
                                  type: string
                                  example: strip_010
                                pathDirection:
                                  description: Path or orbit direction
                                  type: string
                                  example: ascending
                                  enum:
                                  - ascending
                                  - descending
                                lookDirection:
                                  description: Look Direction. Left-looking acquisitions require special authorization.
                                  type: string
                                  enum:
                                  - R
                                  - L
                                incidenceAngle:
                                  description: Incidence angle range in degrees. Only acquisitions with an average incidence angle in this range will be considered.
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    minimum:
                                      type: number
                                      minimum: 10
                                      maximum: 70
                                      example: 30
                                    maximum:
                                      type: number
                                      minimum: 10
                                      maximum: 70
                                      example: 50
                                productType:
                                  description: Product type for the processing of the acuqisition. Mandatory on placing the order, but not for feasibility.
                                  type: string
                                  enum:
                                  - SSC
                                  - MGD
                                  - GEC
                                  - EEC
                                  example: EEC
                                resolutionVariant:
                                  description: Radiometric or spatial enhancement. Mandatory on placing the order, but not for feasibility.
                                  type: string
                                  enum:
                                  - SE
                                  - RE
                                orbitType:
                                  description: Near Realtime acquisitions will incur an additional fee. Science processing is most accurate but takes approx 5 days to complete. Mandatory on placing the order, but not for feasibility.
                                  type: string
                                  enum:
                                  - NRT
                                  - rapid
                                  - science
