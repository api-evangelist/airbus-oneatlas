                                            - potential
                                            - expected
                                          startTime:
                                            type: string
                                            format: date-time
                                          stopTime:
                                            type: string
                                            format: date-time
                                        minLength: 1
                                  required:
                                  - status
                                estimatedDownloadAvailability:
                                  type: string
                                  format: date-time
                                receivingStation:
                                  description: Downlink station to use for direct-access customers
                                  type: string
                                  default: NSG_POOL
