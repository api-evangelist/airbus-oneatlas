                                  type: integer
                                  default: 0
                                  enum:
                                  - 0
                                  - 10
                                  - 20
                                relativeOrbit:
                                  type: integer
                                absoluteOrbit:
                                  type: integer
                                orderTemplate:
                                  type: string
                                lastUpdateTime:
                                  type: string
                                  format: date-time
                                status:
                                  description: Status of item
                                  type: string
                                  enum:
                                  - feasible
                                  - availableInArchive
                                  - unavailable
                                  - submitted
                                  - waitingForAcquisitionApproval
                                  - accepted
                                  - planned
                                  - acquistion
                                  - transition
                                  - downlink
                                  - waitingForOrbit
                                  - processing
                                  - waitingForDeliveryApproval
                                  - delivery
                                  - completed
                                  - failed
                                  - cancelled
                                  - approvalRejected
                                sensitivity:
                                  type: object
                                  additionalProperties: false
                                  required:
                                  - status
                                  properties:
                                    status:
                                      type: string
                                      enum:
                                      - notSensitive
                                      - potential
                                      - sensitive
                                    missingParameters:
                                      description: parameters that need to be set to get definite sensitivity status
                                      type: array
                                      items:
                                        type: string
                                        enum:
                                        - productType
                                        - resolutionVariant
                                      example:
                                      - productType
                                      - resolutionVariant
                                    type:
                                      type: string
                                      enum:
                                      - blacklist
                                      - resolution
                                    sensitivityInformation:
                                      type: string
                                itemType:
                                  type: string
                                  enum:
                                  - catalogue
                                  - future
                                outOfFullPerformance:
                                  description: If set to true and the account is authorized, out of full performance scenes will be included in the response.
                                  type: boolean
                                  default: false
                                scienceOrbitAvailability:
                                  type: boolean
                        - type: object
                          properties:
                            properties:
                              type: object
                              properties:
                                submissionDeadline:
                                  type: string
                                  format: date-time
                                acquisitionOnly:
                                  description: Acquisition is done and archived, but product will not be processed and deliverd. Requires special authorization.
                                  type: boolean
                                  default: false
                                priority:
                                  description: Higher priority orders have a better chance of success but incur an additional fee
                                  type: string
                                  enum:
                                  - standard
                                  - priority
                                  - exclusive
                                  example: standard
                                conflicts:
                                  type: object
                                  properties:
                                    status:
                                      type: string
                                      enum:
                                      - none
                                      - potential
                                      - expected
                                    external:
                                      type: object
                                      additionalProperties:
                                        type: object
                                        properties:
                                          status:
                                            type: string
                                            enum:
                                            - none
                                            - potential
                                            - expected
                                          startTime:
                                            type: string
                                            format: date-time
                                          stopTime:
                                            type: string
                                            format: date-time
                                        minLength: 1
                                    baskets:
                                      type: object
                                      additionalProperties:
                                        type: object
                                        additionalProperties:
                                          type: object
                                          properties:
                                            status:
                                              type: string
                                              enum:
                                              - none
                                              - potential
                                              - expected
                                            startTime:
                                              type: string
                                              format: date-time
                                            stopTime:
                                              type: string
                                              format: date-time
                                          minLength: 1
                                      minLength: 1
                                    shopcart:
                                      type: object
                                      additionalProperties:
                                        type: object
                                        properties:
                                          status:
                                            type: string
                                            enum:
                                            - none
                                            - potential
                                            - expected
                                          startTime:
                                            type: string
                                            format: date-time
                                          stopTime:
                                            type: string
                                            format: date-time
                                        minLength: 1
                                    feasibility:
                                      type: object
