openapi: 3.0.3
info:
  title: OneAtlas WorldDEM Access Subscriptions API
  version: 1.0.1
  contact:
    email: dl-geo-webservices@airbus.com
  description: The OneAtlas WorldDEM API is a tool that provides access to high-resolution global elevation data. This data, collected by satellites and processed using advanced technologies, offers a detailed and accurate representation of the Earth's surface. By integrating the WorldDEM API into their applications, users can benefit from precise terrain information for a wide range of use cases, such as urban planning, disaster response, agriculture, and infrastructure development. This API allows developers to easily incorporate elevation data into their projects, enabling them to create more accurate and effective solutions.
servers:
- url: https://sar.api.oneatlas.airbus.com/v1
  description: OneAtlas - Elevation
security:
- basicAuth: []
tags:
- name: Subscriptions
paths:
  /api/v1/contracts/{contractId}:
    parameters:
    - $ref: '#/components/parameters/contractId'
    get:
      description: Get contract by id
      summary: Get Contract by Id
      tags:
      - Subscriptions
      responses:
        '200':
          content:
            application/json:
              schema:
                $schema: http://json-schema.org/draft-06/schema#
                description: Contracts api
                id: http://local/schemas/private/contracts.json
                oneOf:
                - properties:
                    credits:
                      minimum: 0
                      type: number
                    geofence:
                      $schema: http://json-schema.org/draft-06/schema#
                      definitions:
                        multiPolygonAoi:
                          properties:
                            coordinates:
                              items:
                                items:
                                  items:
                                    items:
                                      type: number
                                    maxItems: 2
                                    minItems: 2
                                    type: array
                                  minItems: 4
                                  type: array
                                minItems: 1
                                type: array
                              minItems: 1
                              type: array
                            type:
                              enum:
                              - MultiPolygon
                          type: object
                        polygonAoi:
                          properties:
                            coordinates:
                              items:
                                items:
                                  items:
                                    type: number
                                  maxItems: 2
                                  minItems: 2
                                  type: array
                                minItems: 4
                                type: array
                              minItems: 1
                              type: array
                            type:
                              enum:
                              - Polygon
                          type: object
                      description: aoi definition
                      id: http://local/schemas/public/aoi.json#
                      oneOf:
                      - properties:
                          coordinates:
                            items:
                              items:
                                items:
                                  type: number
                                maxItems: 2
                                minItems: 2
                                type: array
                              minItems: 4
                              type: array
                            minItems: 1
                            type: array
                          type:
                            enum:
                            - Polygon
                        type: object
                      - properties:
                          coordinates:
                            items:
                              items:
                                items:
                                  items:
                                    type: number
                                  maxItems: 2
                                  minItems: 2
                                  type: array
                                minItems: 4
                                type: array
                              minItems: 1
                              type: array
                            minItems: 1
                            type: array
                          type:
                            enum:
                            - MultiPolygon
                        type: object
                      title: aoi
                      type: object
                    kind:
                      pattern: ^contract.change-detection$
                    name:
                      type: string
                    oneliveZoomLimit:
                      default: 14
                      type:
                      - integer
                      - 'null'
                  required:
                  - name
                  - credits
                  - kind
                  type: object
                - properties:
                    credits:
                      minimum: 0
                      type: number
                    geofence:
                      $schema: http://json-schema.org/draft-06/schema#
                      definitions:
                        multiPolygonAoi:
                          properties:
                            coordinates:
                              items:
                                items:
                                  items:
                                    items:
                                      type: number
                                    maxItems: 2
                                    minItems: 2
                                    type: array
                                  minItems: 4
                                  type: array
                                minItems: 1
                                type: array
                              minItems: 1
                              type: array
                            type:
                              enum:
                              - MultiPolygon
                          type: object
                        polygonAoi:
                          properties:
                            coordinates:
                              items:
                                items:
                                  items:
                                    type: number
                                  maxItems: 2
                                  minItems: 2
                                  type: array
                                minItems: 4
                                type: array
                              minItems: 1
                              type: array
                            type:
                              enum:
                              - Polygon
                          type: object
                      description: aoi definition
                      id: http://local/schemas/public/aoi.json#
                      oneOf:
                      - properties:
                          coordinates:
                            items:
                              items:
                                items:
                                  type: number
                                maxItems: 2
                                minItems: 2
                                type: array
                              minItems: 4
                              type: array
                            minItems: 1
                            type: array
                          type:
                            enum:
                            - Polygon
                        type: object
                      - properties:
                          coordinates:
                            items:
                              items:
                                items:
                                  items:
                                    type: number
                                  maxItems: 2
                                  minItems: 2
                                  type: array
                                minItems: 4
                                type: array
                              minItems: 1
                              type: array
                            minItems: 1
                            type: array
                          type:
                            enum:
                            - MultiPolygon
                        type: object
                      title: aoi
                      type: object
                    kind:
                      pattern: ^contract.oneatlasdata.early-adopter$
                    name:
                      type: string
                    oneliveZoomLimit:
                      default: 14
                      type:
                      - integer
                      - 'null'
                  required:
                  - name
                  - credits
                  - kind
                  type: object
                - properties:
                    credits:
                      minimum: 0
                      type: number
                    geofence:
                      $schema: http://json-schema.org/draft-06/schema#
                      definitions:
                        multiPolygonAoi:
                          properties:
                            coordinates:
                              items:
                                items:
                                  items:
                                    items:
                                      type: number
                                    maxItems: 2
                                    minItems: 2
                                    type: array
                                  minItems: 4
                                  type: array
                                minItems: 1
                                type: array
                              minItems: 1
                              type: array
                            type:
                              enum:
                              - MultiPolygon
                          type: object
                        polygonAoi:
                          properties:
                            coordinates:
                              items:
                                items:
                                  items:
                                    type: number
                                  maxItems: 2
                                  minItems: 2
                                  type: array
                                minItems: 4
                                type: array
                              minItems: 1
                              type: array
                            type:
                              enum:
                              - Polygon
                          type: object
                      description: aoi definition
                      id: http://local/schemas/public/aoi.json#
                      oneOf:
                      - properties:
                          coordinates:
                            items:
                              items:
                                items:
                                  type: number
                                maxItems: 2
                                minItems: 2
                                type: array
                              minItems: 4
                              type: array
                            minItems: 1
                            type: array
                          type:
                            enum:
                            - Polygon
                        type: object
                      - properties:
                          coordinates:
                            items:
                              items:
