                    oneliveZoomLimit:
                      default: 14
                      type:
                      - integer
                      - 'null'
                  required:
                  - name
                  - credits
                  - kind
                  type: object
                - properties:
                    content:
                      properties:
                        datasets:
                          items:
                            enum:
                            - barcelonaHarbor
                            - bostonConventionCenter
                            - budapest
                            - capetownHarbor
                            - casablancaHarbor
                            - dubai
                            - istanbul
                            - mexicoAirport
                            - rio
                            - sanFranciscoAirport
                            - shanghai
                            - sydneyOpera
                            type: string
                          maxItems: 3
                          minItems: 1
                          type: array
                          uniqueItems: true
                      required:
                      - datasets
                      type: object
                    kind:
                      pattern: ^contract.oneatlasdata.freemium$
                    name:
                      type: string
                  required:
                  - content
                  - kind
                  type: object
                title: Contracts
          description: contract
  /api/v1/contracts/{contractId}/payments:
    parameters:
    - $ref: '#/components/parameters/contractId'
    get:
      description: Get all payments for the user contract
      summary: Get All Contract Payments
      tags:
      - Subscriptions
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/itemsPerPage'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $schema: http://json-schema.org/draft-06/schema#
                  additionalProperties: true
                  id: http://local/schemas/private/payments.json#
                  properties:
                    contractId:
                      type: string
                    createdAt:
                      type: string
                    creditAmount:
                      type: integer
                    description:
                      type: string
                    id:
                      type: string
                    orderId:
                      type: string
                    subscriptionId:
                      type: string
                    type:
                      enum:
                      - payment
                      - refund
                      - credit
                      type: string
                  title: Payment schema
                  type: object
                type: array
          description: payment list
