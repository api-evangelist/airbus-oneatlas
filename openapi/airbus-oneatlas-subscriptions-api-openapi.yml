                              coordinates:
                                items:
                                  items:
                                    items:
                                      type: number
                                    maxItems: 2
                                    minItems: 2
                                    type: array
                                  minItems: 4
                                  type: array
                                minItems: 1
                                type: array
                              type:
                                enum:
                                - Polygon
                            type: object
                        description: aoi definition
                        id: http://local/schemas/public/aoi.json#
                        oneOf:
                        - properties:
                            coordinates:
                              items:
                                items:
                                  items:
                                    type: number
                                  maxItems: 2
                                  minItems: 2
                                  type: array
                                minItems: 4
                                type: array
                              minItems: 1
                              type: array
                            type:
                              enum:
                              - Polygon
                          type: object
                        - properties:
                            coordinates:
                              items:
                                items:
                                  items:
                                    items:
                                      type: number
                                    maxItems: 2
                                    minItems: 2
                                    type: array
                                  minItems: 4
                                  type: array
                                minItems: 1
                                type: array
                              minItems: 1
                              type: array
                            type:
                              enum:
                              - MultiPolygon
                          type: object
                        title: aoi
                        type: object
                      monthlyPrice:
                        type: number
                      paymentModality:
                        enum:
                        - monthly
                        - full
                      startedAt:
                        description: ISO 8061 Notation
                        pattern: \s*[0-9]{4}-(0?[1-9]|1[0-2])-(0?[1-9]|[12][0-9]|3[01])\s*
                        type: string
                      streamingPlan:
                        pattern: ^custom$
                      tileAmount:
                        type: integer
                      title:
                        type: string
                      type:
                        pattern: ^view$
                    required:
                    - type
                    - duration
                    - paymentModality
                    - tileAmount
                    - monthlyPrice
                    - streamingPlan
                    type: object
                  - additionalProperties: false
                    properties:
                      aoi:
                        properties:
                          coordinates:
                            items:
                              items:
                                items:
                                  type: number
                                maxItems: 2
                                minItems: 2
                                type: array
                              minItems: 4
                              type: array
                            minItems: 1
                            type: array
                          type:
                            enum:
                            - Polygon
                        type: object
                      duration:
                        enum:
                        - 3
                        - 6
                        - 12
                      frequency:
                        enum:
                        - monthly
                      resolution:
                        enum:
                        - 0.5
                        - 1.5
                      startedAt:
                        description: ISO 8061 Notation
                        pattern: \s*[0-9]{4}-(0?[1-9]|1[0-2])-(0?[1-9]|[12][0-9]|3[01])\s*
                        type: string
                      title:
                        type: string
                      type:
                        pattern: ^change-detection$
                    required:
                    - aoi
                    - type
                    - resolution
                    - duration
                    type: object
                  title: Subscriptions
                type: array
          description: subscription list
