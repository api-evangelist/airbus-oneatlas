                    example: A specific problem occurred during this example
                  instance:
                    type: string
                    description: URI reference that identifies the specific occurrence of the problem.
                    example: /resource/12345/msgs/abc
                additionalProperties:
                  description: Extension Key/Value-Pairs
                required:
                - type
                - title
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                description: RFC-7807 Problem Details
                type: object
                properties:
                  type:
                    type: string
                    description: URI reference that identifies the problem type.
                    example: /problems/example-problem
                  title:
                    type: string
                    description: Human-readable summary of the problem type. Should not change from occurrence to occurrence of the problem.
                    example: Some error occurred
                  status:
