specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Airbus OneAtlas
providerId: airbus-oneatlas
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Imagery
  - Satellites
  - Earth Observation
  - Geospatial
  - Radar
  - Elevation
description: Airbus OneAtlas (Airbus Defence and Space) packages optical imagery (Pléiades Neo,
  Pléiades, SPOT), radar imagery (Radar Constellation), elevation data (WorldDEM Neo), and a
  subscription archive (Living Library). The platform offers Living Library as a subscription, archive
  and tasking on pay-per-order, and 30cm country coverage requests, but does not publish dollar
  amounts, per-km² prices, or quota tiers; "Contact us" / "Get started" is the published path to
  pricing. Guest preview is available "try before you buy."
notes: No public list pricing. Plans below capture Airbus's published commercial models (Living
  Library subscription vs Pay-Per-Order vs Tasking) without fabricating per-km² prices.
sources:
  - https://space-solutions.airbus.com/imagery/how-to-order-imagery-and-data/
plans:
  - id: airbus-oneatlas-living-library
    name: Living Library Subscription
    type: subscription
    description: Subscription access to the global archive (30cm, 50cm, and 1.5m resolution optical
      imagery). Subscription terms and pricing are quoted by Airbus sales.
    entries:
      - label: Subscription
        name: living_library_subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact Airbus
        userMultiplied: false
    elements:
      - name: Pléiades Neo, Pléiades, SPOT archive access
      - name: 30cm / 50cm / 1.5m resolution
      - name: Streaming and download via OneAtlas APIs
  - id: airbus-oneatlas-pay-per-order
    name: Pay-Per-Order (Archive)
    type: pay-as-you-go
    description: Pay-per-order pricing on archive imagery (Pléiades Neo 30cm/HD15, Pléiades 50cm, SPOT
      1.5m, Radar Constellation, WorldDEM elevation). No minimum order; price-per-order quoted
      against the chosen footprint, resolution, and processing level.
    entries:
      - label: Per-order imagery
        name: pay_per_order
        type: metered
        metric: order
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact Airbus / quote per order
        userMultiplied: false
    elements:
      - name: Pléiades Neo archive (30cm, HD15)
      - name: Pléiades and SPOT archive
      - name: Radar Constellation archive (25cm – 40m)
      - name: WorldDEM Neo elevation
  - id: airbus-oneatlas-tasking
    name: Tasking
    type: pay-as-you-go
    description: New-acquisition tasking for optical (Pléiades Neo, Pléiades, SPOT) and radar
      satellites. Priced per acquisition with rush / priority levels available.
    entries:
      - label: Tasking acquisition
        name: tasking
        type: metered
        metric: acquisition
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact Airbus / quote per acquisition
        userMultiplied: false
    elements:
      - name: Pléiades Neo tasking (30cm)
      - name: Pléiades / SPOT tasking
      - name: Radar Constellation tasking (weather/daylight-independent)
      - name: 30cm country coverage requests
  - id: airbus-oneatlas-guest
    name: Guest / Trial Access
    type: freemium
    description: Guest access for evaluating OneAtlas data before committing to a subscription or
      order. No published quota.
    entries:
      - label: Guest preview
        name: guest_preview
        type: quota
        metric: preview
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Try before you buy
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
